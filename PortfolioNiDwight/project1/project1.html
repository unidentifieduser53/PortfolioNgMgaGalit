<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 1 | Purely HTML</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>PROJECT 1</h2>
            <p>Purely HTML code</p>
        </div>
        <nav>
            <!-- If this file is not in the same folder as index.html, change this to ../index.html#activities -->
            <a href="index.html#activities">&larr; Portfolio</a>
            <a href="#table">Table</a>
        </nav>
    </header>

    <section id="table" class="page-hero">
        <h1>Table</h1>
        <p>A class list built with plain HTML tags only.</p>
        <div class="table-wrap">
            <table class="data-table">
                <caption>TABLE</caption>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Section</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Dwight</td>
                        <td>20</td>
                        <td>BSIT31A</td>
                    </tr>
                    <tr>
                        <td>Renzo</td>
                        <td>20</td>
                        <td>BSIT31A</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>&copy;2026 Dwighty's PDM Portfolio. All rights reserved.</p>
    </footer>

    <button class="back-to-top" id="backToTop" title="Back to Top">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
